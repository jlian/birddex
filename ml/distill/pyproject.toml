[project]
name = "wingdex-distill"
version = "0.1.0"
description = "WingDex: BioCLIP-2 -> small student distillation for on-device bird ID (issue #260)"
requires-python = ">=3.12,<3.13"

# Pinned to reproduce the environment the 2026-07 full 7,555-species run was
# trained in. Versions captured from the original venv at
# ~/spikes/bioclip-birdid/.venv before it was retired.
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "open_clip_torch==3.3.0",
    "timm==1.0.28",
    "webdataset==1.0.2",
    "duckdb==1.5.4",
    "numpy==2.4.4",
    "pillow==12.2.0",
    "braceexpand==0.1.7",
    "matplotlib>=3.9",
]

[dependency-groups]
# not needed to train; used by valcos_curve.py / analysis
dev = []

[tool.uv]
# torch cu124 wheels do not live on PyPI -- they come from the pytorch index.
# uv needs an explicit index + per-package pin, otherwise it resolves the CPU
# build from PyPI and CUDA silently disappears.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
