name = "wingdex-app"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/worker/index.js"
preview_urls = true
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Production (default), uses the main database
[[d1_databases]]
binding = "DB"
database_name = "wingdex-db"
database_id = "bb0a4504-8009-4ea3-b462-ce2b9de3d615"
migrations_dir = "migrations"

# OSM place polygons (PMTiles) for local reverse geocoding, see scripts/osm-places.
# Data (c) OpenStreetMap contributors, ODbL 1.0.
[[r2_buckets]]
binding = "PLACES"
bucket_name = "wingdex-places"
# PRODUCTION archive. Previews bind `wingdex-places-preview` instead, because a
# binding grants runtime `put` and `delete` and CI deploys PR code with the
# preview environment. See the env.preview block below.
#
# Cloudflare bindings have no runtime read-only mode, so application types expose
# only `get` and the archive key is immutable by policy. Keep the Worker and D1
# local during development while routing this binding to the real private bucket;
# reverse-geocoding integration tests require remote access to this archive.
remote = true

# Burst guard for Geoapify place search, keyed by account for registered users
# and IP for freely minted anonymous sessions.
[[ratelimits]]
name = "GEOCODING_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Reverse lookup has no provider quota, but every call spends Worker CPU and R2
# Class B operations. Keep it separate so abuse cannot exhaust place search.
[[ratelimits]]
name = "REVERSE_GEOCODING_LIMITER"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 30
  period = 60

# Import is the heaviest write path an account can reach. This throttles bursts;
# the real protection against a forged confirm is signing the preview ids.
# One import spends two requests here, preview and confirm.
[[ratelimits]]
name = "IMPORT_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 40
  period = 60


[vars]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = false

# Preview/dev, uses a separate database
[env.preview]
main = "./dist/worker/index.js"
workers_dev = true

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.preview.vars]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "wingdex-db-dev"
database_id = "7299207b-ddc7-4ecd-bc36-b6838f278c78"
migrations_dir = "migrations"

# Separate namespace so preview traffic cannot spend the production budget.
[[env.preview.ratelimits]]
name = "GEOCODING_LIMITER"
namespace_id = "1002"

  [env.preview.ratelimits.simple]
  limit = 20
  period = 60

[[env.preview.ratelimits]]
name = "REVERSE_GEOCODING_LIMITER"
namespace_id = "1006"

  [env.preview.ratelimits.simple]
  limit = 30
  period = 60

[[env.preview.ratelimits]]
name = "IMPORT_LIMITER"
namespace_id = "1004"

  [env.preview.ratelimits.simple]
  limit = 40
  period = 60

# A SEPARATE bucket from production, holding the same archive.
#
# Wrangler environments do not inherit top-level bindings, so this block has to
# exist at all: omitting it left `env.PLACES` undefined on preview and every
# reverse-geocode request answered 503.
#
# It points at `wingdex-places-preview` rather than production because CI
# deploys PULL REQUEST code with this environment, in two places:
# `.github/workflows/ci.yml` (`versions upload --env preview`) and
# `.github/workflows/release.yml` (`deploy --env preview`). A binding grants
# full `put` and `delete` at runtime, and `ReadonlyR2Bucket` is
# `Pick<R2Bucket, 'get'>`, a compile-time type that erases at runtime and
# constrains only our own code. So a production binding here would let any PR
# branch overwrite or delete the only production archive and take LIVE reverse
# geocoding down, not just its own preview.
#
# Cloudflare has no runtime read-only binding, so separation is the only
# mechanism available.
#
# There is no promotion step. The archive is immutable and dated, so the same
# build is uploaded to both buckets under the same key and the two copies are
# byte-identical. Cost is one extra 1.5 GB object, about 2 cents a month.
[[env.preview.r2_buckets]]
binding = "PLACES"
bucket_name = "wingdex-places-preview"
remote = true


