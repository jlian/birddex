name: iOS Release

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip archive and upload)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check for iOS changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check for iOS-relevant changes since last tag
        id: diff
        run: |
          LAST_TAG=$(git tag --list 'ios-v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous ios-v tag found - first release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- ios/ openapi.yaml .releaserc.ios.json)
            if [ -n "$CHANGED" ]; then
              echo "iOS-relevant changes found since $LAST_TAG"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No iOS-relevant changes since $LAST_TAG"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release:
    name: Release & Upload to TestFlight
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run semantic-release (iOS)
        id: semrel
        working-directory: ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXIT_CODE=0
          OUTPUT=$(npx semantic-release 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"

          # Extract new version from output (POSIX-compatible, no grep -P)
          NEW_VERSION=$(echo "$OUTPUT" | grep -oE 'Published release [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$NEW_VERSION" ]; then
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUTPUT" | grep -qiE 'no (new )?release'; then
            echo "No new version released"
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::semantic-release failed with exit code $EXIT_CODE"
            exit 1
          else
            echo "No new version released"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitInfo.swift
        if: steps.semrel.outputs.released == 'true'
        working-directory: ios
        run: scripts/gen-git-info.sh

      - name: Generate Xcode project
        if: steps.semrel.outputs.released == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Resolve SPM dependencies
        if: steps.semrel.outputs.released == 'true'
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project WingDex.xcodeproj -scheme Production

      - name: Write App Store Connect API key
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run != true
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Archive for App Store
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run != true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WingDex.xcodeproj \
            -scheme Production \
            -archivePath build/WingDex.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            | tail -30

      - name: Export IPA
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run != true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/WingDex.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            | tail -20

      - name: Upload to TestFlight
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run != true
        working-directory: ios
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/WingDex.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # Runners start with an empty keychain, so -allowProvisioningUpdates mints a fresh
      # development certificate every run. Left alone they pile up until the account cap
      # is hit. Their private keys die with the runner, so revoking them is always safe.
      - name: Revoke CI-created signing certificates
        if: always() && steps.semrel.outputs.released == 'true' && inputs.dry_run != true
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        with:
          script: |
            const crypto = require('crypto');

            const missing = ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY'].filter((k) => !process.env[k]);
            if (missing.length) {
              core.setFailed(`Missing required App Store Connect secrets: ${missing.join(', ')}`);
              return;
            }

            const privateKey = Buffer.from(process.env.ASC_PRIVATE_KEY, 'base64').toString('utf8');
            const now = Math.floor(Date.now() / 1000);
            const b64 = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const signingInput = [
              b64({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }),
              b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }),
            ].join('.');
            const sig = crypto.sign('sha256', Buffer.from(signingInput), {
              key: crypto.createPrivateKey(privateKey),
              dsaEncoding: 'ieee-p1363',
            });
            const token = `${signingInput}.${sig.toString('base64url')}`;

            async function asc(path, method = 'GET') {
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
                method,
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!res.ok) {
                throw new Error(`${method} ${path} -> ${res.status} ${await res.text()}`);
              }
              return res.status === 204 ? null : res.json();
            }

            // Xcode names every certificate it creates through the API "Created via API".
            const REVOCABLE = new Set(['DEVELOPMENT', 'IOS_DEVELOPMENT', 'MAC_APP_DEVELOPMENT']);
            const { data } = await asc('/v1/certificates?limit=200');
            const stale = data.filter(
              (c) => c.attributes.displayName === 'Created via API' && REVOCABLE.has(c.attributes.certificateType),
            );

            core.info(`${data.length} certificate(s) on the account, ${stale.length} CI-created`);

            // Best effort per certificate: one failure must not strand the rest.
            let failed = 0;
            for (const cert of stale) {
              try {
                await asc(`/v1/certificates/${cert.id}`, 'DELETE');
                core.info(`Revoked ${cert.attributes.certificateType} ${cert.id} (expiry ${cert.attributes.expirationDate})`);
              } catch (err) {
                failed += 1;
                core.warning(`Could not revoke ${cert.id}: ${err.message}`);
              }
            }
            if (failed) {
              core.setFailed(`${failed} of ${stale.length} certificate(s) could not be revoked`);
            }

      - name: Clean up API key
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Mark pre-1.0 releases as prerelease
        if: steps.semrel.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.semrel.outputs.new_version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" = "0" ]; then
            gh release edit "ios-v${VERSION}" --prerelease
          fi

      - name: Summary
        if: steps.semrel.outputs.released == 'true'
        run: |
          echo "### iOS Release v${{ steps.semrel.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run - archive and upload skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          fi
