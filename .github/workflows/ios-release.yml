name: iOS Release

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate tests, archive, and export without publishing or uploading'
        type: boolean
        default: false
      release_version:
        description: 'Existing ios-v version to rebuild/upload (for example, 0.8.0)'
        type: string
        required: false
      build_number:
        description: 'Unused App Store build number (required with release_version)'
        type: string
        required: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check for iOS changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check for iOS-relevant changes since last tag
        id: diff
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            if ! echo "$RELEASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::release_version must use semantic version format, for example 0.8.0"
              exit 1
            fi
            if ! echo "$BUILD_NUMBER" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::build_number is required with release_version and must be a positive integer"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/ios-v${RELEASE_VERSION}"; then
              echo "::error::Tag ios-v${RELEASE_VERSION} does not exist"
              exit 1
            fi
            echo "Rebuilding existing ios-v${RELEASE_VERSION}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'ios-v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous ios-v tag found - first release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- ios/ openapi.yaml ios/.releaserc.json .github/workflows/ios-release.yml)
            if [ -n "$CHANGED" ]; then
              echo "iOS-relevant changes found since $LAST_TAG"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No iOS-relevant changes since $LAST_TAG"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  preflight:
    name: Test, Archive & Export
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-26
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      has_release: ${{ steps.version.outputs.has_release }}
      source_sha: ${{ steps.source_sha.outputs.sha }}
    steps:
      # Two modes, and the difference matters:
      #   release_version set -> rebuild a shipped release, so check out that tag's
      #     app source. Today's main would give current code wearing an old version.
      #   normal release -> check out the BRANCH TIP, not github.sha. This workflow
      #     shares the release-<ref> concurrency group with release.yml, so it can
      #     start only after that workflow already pushed a version-bump commit to
      #     main. A checkout pinned to the triggering sha is then one commit behind
      #     the remote and semantic-release refuses to release from a stale branch:
      #     "The local branch main is behind the remote one". github.ref resolves at
      #     execution time, so it includes that bump.
      # Fixed once in 8a72195, then silently reverted by 60189c3 when the tag path
      # arrived, which broke the 2026-08-10 release. Do not put github.sha back.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_version && format('refs/tags/ios-v{0}', inputs.release_version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Pin everything downstream to the exact commit this job built, so publish
      # cannot silently release a newer one if main advances during the macOS
      # archive (several minutes).
      - name: Record the built source commit
        id: source_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rebuilding an existing release checks out the app source at its tag, but
      # older tags predate CI tooling this job needs. ios-v0.8.0, for example, has
      # neither scripts/inspect-archive.sh nor the pinned Package.resolved that
      # -onlyUsePackageVersionsFromResolvedFile requires, so the rebuild would fail
      # before upload. Restore just those files from the dispatching commit so the
      # tagged app builds with current release tooling. The normal release path
      # already checks out the branch tip, so it needs nothing here.
      - name: Restore release tooling from current commit
        if: inputs.release_version != ''
        env:
          TOOLING_REF: ${{ github.sha }}
        run: |
          git checkout "$TOOLING_REF" -- \
            ios/scripts/inspect-archive.sh \
            ios/WingDex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Determine release version
        id: version
        working-directory: ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$EXISTING_VERSION" ]; then
            echo "release_version=$EXISTING_VERSION" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          NEXT_VERSION=$(echo "$OUTPUT" | awk '
            match(tolower($0), /next release version is [0-9]+\.[0-9]+\.[0-9]+/) {
              version = substr($0, RSTART, RLENGTH)
              sub(/^.* /, "", version)
              print version
            }
          ' | tail -1)
          if [ -n "$NEXT_VERSION" ]; then
            echo "release_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUTPUT" | grep -qiE 'no (new )?release|no relevant changes.*no new version is released'; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine the next iOS release version"
            exit 1
          fi

      - name: Stop when no release is due
        if: steps.version.outputs.has_release != 'true'
        run: echo "No iOS release is due."

      - name: Apply release version locally
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: scripts/bump-version.sh set "${{ steps.version.outputs.release_version }}" "${BUILD_NUMBER:-1}" --quiet

      - name: Generate Xcode project
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Resolve SPM dependencies
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project WingDex.xcodeproj -scheme Production -onlyUsePackageVersionsFromResolvedFile

      # The preflight tests must never touch the production backend. The old step
      # ran the Production scheme (Production Debug config, API_BASE_URL=https://wingdex.app).
      # Because that is a debug build, the app's #if DEBUG launch hooks compile in, so
      # the UI tests' --auto-sign-in and --auto-demo-data created real anonymous accounts
      # and wrote demo rows into the live database. Switching to the Dev scheme was
      # rejected: dev and prod APIs drift, so dev does not validate the released code.
      # Instead, stand up a throwaway local Worker (mirroring ios.yml) and point the app
      # at it. Release build and signing validation still happens in the Archive step,
      # which builds the Production/Release configuration.
      - name: Write .dev.vars for local Worker
        if: steps.version.outputs.has_release == 'true'
        run: |
          umask 077
          printf 'BETTER_AUTH_SECRET=%s\nGEOAPIFY_KEY=%s\n' \
            "$BETTER_AUTH_SECRET" "$GEOAPIFY_KEY" > .dev.vars
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}

      - name: Build web app
        if: steps.version.outputs.has_release == 'true'
        run: npm run build

      - name: Apply local D1 migrations
        if: steps.version.outputs.has_release == 'true'
        run: npm run db:migrate

      - name: Start local Worker
        if: steps.version.outputs.has_release == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health > /dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://localhost:5000/api/health > /dev/null 2>&1 || (echo "Server failed to start within 30s"; exit 1)
          echo "Server ready on :5000"

      - name: Run iOS tests
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          # Rebuilding an existing release checks out that tag's sources, and
          # xcodegen generates the schemes from that tag's project.yml. Tags
          # ios-v0.1.0 through ios-v0.3.0 define no schemes block, so no
          # Localhost scheme exists to test and xcodebuild would fail here before
          # archive/upload. Those releases were already tested when they shipped,
          # and the Archive step still validates the rebuild, so skip the
          # preflight tests when the tag has no Localhost scheme instead of
          # failing the rebuild. Newer tags generate the scheme and test normally.
          if [ ! -f WingDex.xcodeproj/xcshareddata/xcschemes/Localhost.xcscheme ]; then
            echo "Localhost scheme absent in these sources; skipping preflight tests for this rebuild."
            exit 0
          fi
          xcodebuild \
            -project WingDex.xcodeproj \
            -scheme Localhost \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            test \
            CODE_SIGNING_ALLOWED=NO \
            API_BASE_URL=http://localhost:5000 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) CI' \
            -onlyUsePackageVersionsFromResolvedFile \
            | tail -60

      - name: Write App Store Connect API key
        if: steps.version.outputs.has_release == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Archive for App Store
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WingDex.xcodeproj \
            -scheme Production \
            -archivePath build/WingDex.xcarchive \
            -destination 'generic/platform=iOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            | tail -30

      - name: Inspect signed archive
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        env:
          REQUIRE_SIGNED: '1'
        run: |
          # Tags older than the privacy manifest are rebuilt from their own sources.
          if [ -f WingDex/Resources/PrivacyInfo.xcprivacy ]; then
            export REQUIRE_PRIVACY_MANIFEST=1
          else
            export REQUIRE_PRIVACY_MANIFEST=0
          fi
          scripts/inspect-archive.sh build/WingDex.xcarchive build/archive-inspection

      - name: Export IPA
        if: steps.version.outputs.has_release == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/WingDex.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            | tail -20

      - name: Upload validated IPA artifact
        if: steps.version.outputs.has_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: WingDex-${{ steps.version.outputs.release_version }}
          path: |
            ios/build/export/WingDex.ipa
            ios/build/archive-inspection/
            ios/build/WingDex.xcarchive/dSYMs/
          if-no-files-found: error
          retention-days: 7

      # Runners start with an empty keychain, so -allowProvisioningUpdates mints a fresh
      # development certificate every run. Left alone they pile up until the account cap
      # is hit. Their private keys die with the runner, so revoking them is always safe.
      - name: Revoke CI-created signing certificates
        if: always() && steps.version.outputs.has_release == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        with:
          script: |
            const crypto = require('crypto');

            const missing = ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY'].filter((k) => !process.env[k]);
            if (missing.length) {
              core.setFailed(`Missing required App Store Connect secrets: ${missing.join(', ')}`);
              return;
            }

            const privateKey = Buffer.from(process.env.ASC_PRIVATE_KEY, 'base64').toString('utf8');
            const now = Math.floor(Date.now() / 1000);
            const b64 = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const signingInput = [
              b64({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }),
              b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }),
            ].join('.');
            const sig = crypto.sign('sha256', Buffer.from(signingInput), {
              key: crypto.createPrivateKey(privateKey),
              dsaEncoding: 'ieee-p1363',
            });
            const token = `${signingInput}.${sig.toString('base64url')}`;

            async function asc(path, method = 'GET') {
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
                method,
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!res.ok) {
                throw new Error(`${method} ${path} -> ${res.status} ${await res.text()}`);
              }
              return res.status === 204 ? null : res.json();
            }

            // Xcode names every certificate it creates through the API "Created via API".
            const REVOCABLE = new Set(['DEVELOPMENT', 'IOS_DEVELOPMENT', 'MAC_APP_DEVELOPMENT']);
            const { data } = await asc('/v1/certificates?limit=200');
            const stale = data.filter(
              (c) => c.attributes.displayName === 'Created via API' && REVOCABLE.has(c.attributes.certificateType),
            );

            core.info(`${data.length} certificate(s) on the account, ${stale.length} CI-created`);

            // Best effort per certificate: one failure must not strand the rest.
            let failed = 0;
            for (const cert of stale) {
              try {
                await asc(`/v1/certificates/${cert.id}`, 'DELETE');
                core.info(`Revoked ${cert.attributes.certificateType} ${cert.id} (expiry ${cert.attributes.expirationDate})`);
              } catch (err) {
                failed += 1;
                core.warning(`Could not revoke ${cert.id}: ${err.message}`);
              }
            }
            if (failed) {
              core.setFailed(`${failed} of ${stale.length} certificate(s) could not be revoked`);
            }

      - name: Clean up API key
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Validation summary
        if: steps.version.outputs.has_release == 'true'
        run: |
          echo "### Validated iOS v${{ steps.version.outputs.release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests, signed archive inspection, dSYM matching, and App Store export succeeded before publication." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish & Upload to TestFlight
    needs: [check, preflight]
    if: needs.check.outputs.should_release == 'true' && needs.preflight.outputs.has_release == 'true' && inputs.dry_run != true
    runs-on: macos-26
    steps:
      # Check out the exact commit preflight built and versioned, NOT the branch tip.
      # Preflight already resolved the tip to pick up any version bump release.yml
      # pushed while this run was queued. Re-resolving here would open a second
      # window: another merge can advance main during the macOS archive, and
      # semantic-release would then tag commits that are not in the IPA this job
      # uploads. Pinning keeps the released tag, the version, and the artifact in
      # agreement.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: inputs.release_version == ''
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: inputs.release_version == ''
        run: npm ci

      - name: Install XcodeGen
        if: inputs.release_version == ''
        run: brew install xcodegen

      - name: Publish semantic release
        if: inputs.release_version == ''
        working-directory: ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Download validated IPA artifact
        uses: actions/download-artifact@v7
        with:
          name: WingDex-${{ needs.preflight.outputs.release_version }}
          path: build

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/WingDex.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Clean up API key
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Mark pre-1.0 releases as prerelease
        if: inputs.release_version == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.preflight.outputs.release_version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" = "0" ]; then
            gh release edit "ios-v${VERSION}" --prerelease
          fi

      - name: Summary
        run: |
          echo "### iOS Release v${{ needs.preflight.outputs.release_version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "Rebuilt and uploaded existing release as build ${{ inputs.build_number }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published and uploaded to TestFlight." >> "$GITHUB_STEP_SUMMARY"
          fi
