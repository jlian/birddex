name: iOS Build & Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  pull_request:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'functions/**'
      - 'migrations/**'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'functions/**'
      - 'migrations/**'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select accessibility coverage
        id: accessibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME always runs the full accessibility suite" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=base commit unavailable; failing open" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          run=false
          reason="only known non-UI paths changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              ios/WingDex/Views/*|ios/WingDex/App/*|ios/WingDex/ViewModels/*|ios/WingDex/Services/AuthService.swift|ios/WingDex/Services/UITestDataService.swift|ios/WingDex/Extensions/Theme.swift|ios/WingDex/Assets.xcassets/*|ios/WingDex/Resources/*|ios/WingDexUITests/*|ios/project.yml|ios/WingDex.xcodeproj/*|.github/workflows/ios.yml)
                run=true
                reason="$path is UI-facing"
                break
                ;;
              functions/*|migrations/*|openapi.yaml|public/models/*|public/priors/*|src/lib/bird-id-local-adapter.ts|src/lib/rarity.ts|src/lib/taxonomy.json|ios/WingDex/Services/*|ios/WingDex/Models/*|ios/WingDex/ML/*|ios/WingDexTests/*|ios/WingDexShareExtension/*|ios/scripts/*|ios/build/*|ios/README.md|ios/package.json|ios/ExportOptions.plist|.github/workflows/ios-release.yml|.github/workflows/release.yml)
                ;;
              ios/*)
                run=true
                reason="$path is an unclassified iOS path; failing open"
                break
                ;;
            esac
          done <<< "$changed"

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Accessibility coverage"
            echo "- Run full audits: \`$run\`"
            echo "- Reason: $reason"
            echo "<details><summary>Changed paths</summary>"
            echo
            echo '```text'
            printf '%s\n' "$changed"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # DerivedData is toolchain-specific, so a cache restored across an Xcode
      # bump would be stale. Key on the installed xcodebuild version too.
      - name: Read Xcode cache version
        id: xcode-cache-version
        run: |
          echo "value=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # SPM checkouts and DerivedData survive across runs on the same
      # Package.resolved, so a warm cache skips dependency resolution and
      # lets xcodebuild reuse module/index artifacts.
      - name: Cache SwiftPM and DerivedData
        id: build-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/DerivedData
          key: ios-spm-dd-v2-no-app-icon-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('ios/WingDex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/project.yml', 'ios/scripts/fix-icon-ref.sh') }}
          restore-keys: |
            ios-spm-dd-v2-no-app-icon-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-

      - name: Cache XcodeGen
        id: xcodegen-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/wingdex/xcodegen-2.46.0
          key: ios-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}

      - name: Cache generated Bird ID assets
        id: bird-id-cache
        uses: actions/cache@v5
        with:
          path: |
            ios/WingDex/Resources/BirdID
            ios/build/generated/sync-birdid-assets.stamp
          key: ios-bird-id-v1-${{ hashFiles('ios/scripts/sync-birdid-assets.sh', 'public/models/text_classifier_int8.bin', 'public/priors/occurrence.*.bin.gz', 'public/priors/rarity.*.bin.gz', 'src/lib/bird-id-local-adapter.ts', 'src/lib/rarity.ts', 'src/lib/taxonomy.json', 'ios/WingDex/Resources/taxonomy.json') }}

      - name: Create iOS Simulator
        run: |
          set -euo pipefail
          echo "Available simulators before CI device creation:"
          xcrun simctl list devices available

          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r --arg version "$SDK_VERSION" '
            [.runtimes[] | select(
              .isAvailable == true
              and .version == $version
              and ((.identifier // "") | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
            )]
            | first
            | .identifier // empty
          ')
          if [ -z "$RUNTIME_ID" ]; then
            xcodebuild -downloadPlatform iOS
            RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r --arg version "$SDK_VERSION" '
              [.runtimes[] | select(
                .isAvailable == true
                and .version == $version
                and ((.identifier // "") | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              )]
              | first
              | .identifier // empty
            ')
          fi
          if [ -z "$RUNTIME_ID" ]; then
            echo "No iOS $SDK_VERSION Simulator runtime is available"
            exit 1
          fi

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '
            [.devicetypes[] | select(.productFamily == "iPhone")]
            | sort_by(if .name == "iPhone 17 Pro" then 0 else 1 end)
            | first
            | .identifier // empty
          ')
          if [ -z "$DEVICE_TYPE_ID" ]; then
            echo "No iPhone Simulator device type is available"
            exit 1
          fi

          simulator_name="WingDex CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          IOS_SIMULATOR_UDID=$(xcrun simctl create "$simulator_name Core" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
          if [[ "${{ steps.accessibility.outputs.run }}" == "true" ]]; then
            IOS_ACCESSIBILITY_SIMULATOR_UDID=$(xcrun simctl create "$simulator_name Accessibility" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
            echo "IOS_ACCESSIBILITY_SIMULATOR_UDID=$IOS_ACCESSIBILITY_SIMULATOR_UDID" >> "$GITHUB_ENV"
          fi

      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        working-directory: ios
        env:
          WINGDEX_SKIP_APP_ICON: "1"
        run: xcodegen generate

      - name: Build for Simulator
        working-directory: ios
        run: |
          started_at=$(date +%s)
          # The app icon is an Icon Composer bundle: layered SVGs with gradient
          # fill specializations and light/dark variants. Rasterizing it into
          # every size and appearance took 145s of a 5m31s build on the runner,
          # and no test looks at the icon. Release builds archive through
          # ios-release.yml and are unaffected.
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -project WingDex.xcodeproj \
            -scheme Dev \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -showBuildTimingSummary \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1
          echo "- Build for testing: $(( $(date +%s) - started_at ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_UDID" &
          core_boot_pid=$!
          if [[ -n "${IOS_ACCESSIBILITY_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl boot "$IOS_ACCESSIBILITY_SIMULATOR_UDID" &
            accessibility_boot_pid=$!
          fi
          wait "$core_boot_pid"
          if [[ -n "${accessibility_boot_pid:-}" ]]; then
            wait "$accessibility_boot_pid"
          fi

      - name: Select API backend
        env:
          # The zone's Bot Fight Mode challenges GitHub runner IPs; workers.dev is the same Worker.
          DEV_URL: https://wingdex-app-preview.lianguanlun.workers.dev
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PREVIEW_ENVIRONMENT: preview (#${{ github.event.pull_request.number }})
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          probe_backend() {
            local response http_status body
            response=$(curl -sS --max-time 15 -w '\n%{http_code}' "$1/api/health" 2>&1) || {
              echo "  $1/api/health could not be reached: $(printf '%s' "$response" | tr '\n' ' ' | cut -c1-200)"
              return 1
            }
            http_status=${response##*$'\n'}
            body=${response%$'\n'*}
            if [ "$http_status" != "200" ] || ! jq -e '.status == "ok" and .db == "ok"' <<< "$body" > /dev/null 2>&1; then
              echo "  $1/api/health returned HTTP $http_status: $(printf '%s' "$body" | tr '\n' ' ' | cut -c1-200)"
              return 1
            fi
          }

          wait_for_backend() {
            local url="$1"
            local attempts="$2"
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if probe_backend "$url"; then
                return 0
              fi
              if ((attempt < attempts)); then
                sleep 5
              fi
            done
            return 1
          }

          wait_for_preview() {
            local attempts="$1"
            local deployment_id
            local preview_url
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if ! deployment_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
                -f sha="$PREVIEW_SHA" \
                -f environment="$PREVIEW_ENVIRONMENT" \
                -f per_page=1 \
                --jq '.[0].id // empty' 2>/dev/null); then
                deployment_id=""
              fi
              if [ -n "$deployment_id" ]; then
                if ! preview_url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                  --jq 'if .[0].state == "success" then (.[0].environment_url // "") else "" end' 2>/dev/null); then
                  preview_url=""
                fi
                if [ -n "$preview_url" ] && probe_backend "$preview_url"; then
                  API_BASE_URL="$preview_url"
                  return 0
                fi
              fi
              if ((attempt < attempts)); then
                sleep 5
              fi
            done
            return 1
          }

          API_BASE_URL="$DEV_URL"
          BACKEND_SOURCE="dev"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" != "dev" ] && [ "$HEAD_REF" != "main" ]; then
            echo "Waiting for $PREVIEW_ENVIRONMENT at commit $PREVIEW_SHA"
            if ! wait_for_preview 60; then
              echo "::error::The exact PR preview did not become healthy: $PREVIEW_ENVIRONMENT at $PREVIEW_SHA"
              exit 1
            fi
            BACKEND_SOURCE="PR preview"
          else
            echo "This event does not create a PR preview; using the dev backend"
          fi

          if ! wait_for_backend "$API_BASE_URL" 6; then
            echo "::error::Selected iOS test backend is not healthy: $API_BASE_URL"
            exit 1
          fi

          echo "Selected iOS test backend: $BACKEND_SOURCE"
          echo "Backend URL: $API_BASE_URL"
          echo "Health check: ok"

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          {
            echo "### iOS test backend"
            echo "- URL: \`$API_BASE_URL\`"
            echo "- Selection: $BACKEND_SOURCE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for iOS Simulator
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b &
          core_boot_pid=$!
          if [[ -n "${IOS_ACCESSIBILITY_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl bootstatus "$IOS_ACCESSIBILITY_SIMULATOR_UDID" -b &
            accessibility_boot_pid=$!
          fi
          wait "$core_boot_pid"
          if [[ -n "${accessibility_boot_pid:-}" ]]; then
            wait "$accessibility_boot_pid"
          fi

      - name: Run tests
        working-directory: ios
        run: |
          set -uo pipefail
          mkdir -p build/logs
          started_at=$(date +%s)

          xctestrun=""
          xctestrun_count=0
          while IFS= read -r candidate; do
            xctestrun=$candidate
            xctestrun_count=$((xctestrun_count + 1))
          done < <(find "build/DerivedData/Build/Products" -maxdepth 2 -name '*.xctestrun' -type f)
          if [[ "$xctestrun_count" != 1 ]]; then
            echo "::error::Expected one .xctestrun file, found $xctestrun_count"
            find "build/DerivedData/Build/Products" -maxdepth 2 -name '*.xctestrun' -type f
            exit 1
          fi

          core_pid=""
          accessibility_pid=""
          terminate_lanes() {
            trap - INT TERM
            [[ -z "$core_pid" ]] || kill "$core_pid" >/dev/null 2>&1 || true
            [[ -z "$accessibility_pid" ]] || kill "$accessibility_pid" >/dev/null 2>&1 || true
            [[ -z "$core_pid" ]] || wait "$core_pid" >/dev/null 2>&1 || true
            [[ -z "$accessibility_pid" ]] || wait "$accessibility_pid" >/dev/null 2>&1 || true
            exit 130
          }
          trap terminate_lanes INT TERM

          NSUnbufferedIO=YES TEST_RUNNER_API_BASE_URL="$API_BASE_URL" xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/CoreTests.xcresult \
            -only-testing:WingDexTests \
            -only-testing:WingDexUITests \
            CODE_SIGNING_ALLOWED=NO > build/logs/core.log 2>&1 &
          core_pid=$!

          if [[ "${{ steps.accessibility.outputs.run }}" == "true" ]]; then
            NSUnbufferedIO=YES TEST_RUNNER_API_BASE_URL="$API_BASE_URL" xcodebuild test-without-building \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$IOS_ACCESSIBILITY_SIMULATOR_UDID" \
              -parallel-testing-enabled NO \
              -resultBundlePath build/AccessibilityTests.xcresult \
              -only-testing:WingDexAccessibilityUITests \
              CODE_SIGNING_ALLOWED=NO > build/logs/accessibility.log 2>&1 &
            accessibility_pid=$!
          fi

          core_status=0
          accessibility_status=0
          wait "$core_pid" || core_status=$?
          if [[ -n "$accessibility_pid" ]]; then
            wait "$accessibility_pid" || accessibility_status=$?
          fi
          echo "$core_status" > build/logs/core.status
          sed -u 's/^/[core] /' build/logs/core.log
          if [[ -n "$accessibility_pid" ]]; then
            echo "$accessibility_status" > build/logs/accessibility.status
            sed -u 's/^/[accessibility] /' build/logs/accessibility.log
          fi

          {
            echo "- Test wall time: $(( $(date +%s) - started_at ))s"
            echo "- Core lane exit: $core_status"
            if [[ -n "$accessibility_pid" ]]; then
              echo "- Accessibility lane exit: $accessibility_status"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ((core_status != 0 || accessibility_status != 0)); then
            exit 1
          fi

      - name: Summarize iOS test timing
        if: always()
        working-directory: ios
        run: |
          set -uo pipefail
          {
            echo "### iOS CI timing"
            echo "- DerivedData/SwiftPM cache hit: \`${{ steps.build-cache.outputs.cache-hit }}\`"
            echo "- XcodeGen cache hit: \`${{ steps.xcodegen-cache.outputs.cache-hit }}\`"
            echo "- Bird ID asset cache hit: \`${{ steps.bird-id-cache.outputs.cache-hit }}\`"
            echo "- Total elapsed: $(( $(date +%s) - CI_STARTED_AT ))s"
          } >> "$GITHUB_STEP_SUMMARY"

          for bundle in build/*.xcresult; do
            [[ -d "$bundle" ]] || continue
            name=$(basename "$bundle" .xcresult)
            summary=$(xcrun xcresulttool get test-results summary --path "$bundle" --compact 2>/dev/null || true)
            {
              echo "#### $name"
              if [[ -n "$summary" ]]; then
                jq -r '
                  "- Tests: \(.totalTestCount), passed: \(.passedTests), failed: \(.failedTests), skipped: \(.skippedTests)",
                  (if (.startTime | type) == "number" and (.finishTime | type) == "number"
                   then "- XCTest duration: \((.finishTime - .startTime) | floor)s"
                   else empty
                   end)
                ' <<< "$summary"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iOS-test-diagnostics
          path: |
            ios/build/*.xcresult
            ios/build/logs
          retention-days: 7

      - name: Clean up iOS simulators
        if: always()
        run: |
          set +e
          xcrun simctl list devices -j \
            | jq -r --arg prefix "WingDex CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
                .devices[][]
                | select(.name == ($prefix + " Core") or .name == ($prefix + " Accessibility"))
                | .udid
              ' \
            | while IFS= read -r udid; do
                xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
                xcrun simctl delete "$udid" >/dev/null 2>&1 || true
              done
