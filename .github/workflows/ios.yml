name: iOS Build & Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  pull_request:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'functions/**'
      - 'migrations/**'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'functions/**'
      - 'migrations/**'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  plan:
    name: Plan iOS coverage
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      accessibility: ${{ steps.accessibility.outputs.run }}
      accessibility_reason: ${{ steps.accessibility.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select accessibility coverage
        id: accessibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME always runs the full accessibility suite" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=base commit unavailable; failing open" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          run=false
          reason="only known non-UI paths changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              ios/WingDex/Views/*|ios/WingDex/App/*|ios/WingDex/ViewModels/*|ios/WingDex/Services/AuthService.swift|ios/WingDex/Services/UITestDataService.swift|ios/WingDex/Extensions/Theme.swift|ios/WingDex/Assets.xcassets/*|ios/WingDex/Resources/*|ios/WingDexUITests/*|ios/project.yml|ios/WingDex.xcodeproj/*|.github/workflows/ios.yml)
                run=true
                reason="$path is UI-facing"
                break
                ;;
              functions/*|migrations/*|openapi.yaml|public/models/*|public/priors/*|src/lib/bird-id-local-adapter.ts|src/lib/rarity.ts|src/lib/taxonomy.json|ios/WingDex/Services/*|ios/WingDex/Models/*|ios/WingDex/ML/*|ios/WingDexTests/*|ios/WingDexShareExtension/*|ios/scripts/*|ios/build/*|ios/README.md|ios/package.json|ios/ExportOptions.plist|.github/workflows/ios-release.yml|.github/workflows/release.yml)
                ;;
              ios/*)
                run=true
                reason="$path is an unclassified iOS path; failing open"
                break
                ;;
            esac
          done <<< "$changed"

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Accessibility coverage"
            echo "- Run full audits: \`$run\`"
            echo "- Reason: $reason"
            echo "<details><summary>Changed paths</summary>"
            echo
            echo '```text'
            printf '%s\n' "$changed"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build test matrix
        id: matrix
        env:
          RUN_ACCESSIBILITY: ${{ steps.accessibility.outputs.run }}
        run: |
          if [[ "$RUN_ACCESSIBILITY" == "true" ]]; then
            echo 'value={"include":[{"lane":"core"},{"lane":"accessibility"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'value={"include":[{"lane":"core"}]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: iOS ${{ matrix.lane }} lane
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Read Xcode cache version
        id: xcode-cache-version
        run: echo "value=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM and DerivedData
        id: build-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/DerivedData
          key: ios-spm-dd-v2-no-app-icon-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-${{ hashFiles('ios/WingDex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/project.yml', 'ios/scripts/fix-icon-ref.sh') }}
          restore-keys: |
            ios-spm-dd-v2-no-app-icon-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-version.outputs.value }}-

      - name: Cache XcodeGen
        id: xcodegen-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/wingdex/xcodegen-2.46.0
          key: ios-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}

      - name: Cache generated Bird ID assets
        id: bird-id-cache
        uses: actions/cache@v5
        with:
          path: |
            ios/WingDex/Resources/BirdID
            ios/build/generated/sync-birdid-assets.stamp
          key: ios-bird-id-v1-${{ hashFiles('ios/scripts/sync-birdid-assets.sh', 'public/models/text_classifier_int8.bin', 'public/priors/occurrence.*.bin.gz', 'public/priors/rarity.*.bin.gz', 'src/lib/bird-id-local-adapter.ts', 'src/lib/rarity.ts', 'src/lib/taxonomy.json', 'ios/WingDex/Resources/taxonomy.json') }}

      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        working-directory: ios
        env:
          WINGDEX_SKIP_APP_ICON: '1'
        run: xcodegen generate

      - name: Create iOS Simulator
        run: |
          set -euo pipefail
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r --arg version "$SDK_VERSION" '
            [.runtimes[] | select(.isAvailable == true and .version == $version and ((.identifier // "") | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))] | first | .identifier // empty
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '
            [.devicetypes[] | select(.productFamily == "iPhone")] | sort_by(if .name == "iPhone 17 Pro" then 0 else 1 end) | first | .identifier // empty
          ')
          if [[ -z "$RUNTIME_ID" || -z "$DEVICE_TYPE_ID" ]]; then
            echo "::error::No matching iOS simulator runtime or iPhone device type"
            exit 1
          fi
          IOS_SIMULATOR_UDID=$(xcrun simctl create "WingDex ${{ matrix.lane }} $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "IOS_SIMULATOR_UDID=$IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        id: build
        working-directory: ios
        run: |
          started_at=$(date +%s)
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -project WingDex.xcodeproj \
            -scheme Dev \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -showBuildTimingSummary \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1
          echo "elapsed=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Start iOS Simulator
        run: xcrun simctl boot "$IOS_SIMULATOR_UDID"

      - name: Wait for iOS Simulator
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b

      - name: Select API backend
        if: matrix.lane == 'core'
        id: backend
        env:
          DEV_URL: https://wingdex-app-preview.lianguanlun.workers.dev
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
          PREVIEW_ENVIRONMENT: preview (#${{ github.event.pull_request.number }})
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          started_at=$(date +%s)

          probe_backend() {
            local response http_status body
            response=$(curl -sS --max-time 15 -w '\n%{http_code}' "$1/api/health" 2>&1) || {
              echo "  $1/api/health could not be reached: $(printf '%s' "$response" | tr '\n' ' ' | cut -c1-200)"
              return 1
            }
            http_status=${response##*$'\n'}
            body=${response%$'\n'*}
            if [[ "$http_status" != "200" ]] || ! jq -e '.status == "ok" and .db == "ok"' <<< "$body" > /dev/null; then
              echo "  $1/api/health returned HTTP $http_status: $(printf '%s' "$body" | tr '\n' ' ' | cut -c1-200)"
              return 1
            fi
          }

          wait_for_backend() {
            local url=$1 attempts=$2
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if probe_backend "$url"; then return 0; fi
              if ((attempt < attempts)); then sleep 5; fi
            done
            return 1
          }

          wait_for_preview() {
            local attempts=$1 deployment_id preview_url
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              deployment_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
                -f sha="$PREVIEW_SHA" -f environment="$PREVIEW_ENVIRONMENT" -f per_page=1 \
                --jq '.[0].id // empty' 2>/dev/null || true)
              if [[ -n "$deployment_id" ]]; then
                preview_url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                  --jq 'if .[0].state == "success" then (.[0].environment_url // "") else "" end' \
                  2>/dev/null || true)
                if [[ -n "$preview_url" ]] && probe_backend "$preview_url"; then
                  API_BASE_URL=$preview_url
                  return 0
                fi
              fi
              if ((attempt < attempts)); then sleep 5; fi
            done
            return 1
          }

          API_BASE_URL=$DEV_URL
          BACKEND_SOURCE=dev
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != "dev" && "$HEAD_REF" != "main" ]]; then
            if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$ACTOR" != "dependabot[bot]" ]]; then
              if ! wait_for_preview 60; then
                echo "::error::The exact PR preview did not become healthy: $PREVIEW_ENVIRONMENT at $PREVIEW_SHA"
                exit 1
              fi
              BACKEND_SOURCE="PR preview"
            else
              # Fork and Dependabot PRs cannot receive Cloudflare credentials,
              # so ci.yml intentionally creates no exact preview deployment.
              if ! wait_for_backend "$API_BASE_URL" 6; then
                echo "::error::The fallback dev iOS test backend is not healthy: $API_BASE_URL"
                exit 1
              fi
              BACKEND_SOURCE="dev fallback for untrusted PR"
            fi
          elif ! wait_for_backend "$API_BASE_URL" 6; then
            echo "::error::The dev iOS test backend is not healthy: $API_BASE_URL"
            exit 1
          fi

          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "api_base_url=$API_BASE_URL"
            echo "source=$BACKEND_SOURCE"
            echo "elapsed=$elapsed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### iOS test backend"
            echo "- URL: \`$API_BASE_URL\`"
            echo "- Selection: $BACKEND_SOURCE"
            echo "- Wait after build: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run selected tests
        id: tests
        working-directory: ios
        env:
          API_BASE_URL: ${{ steps.backend.outputs.api_base_url }}
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          set -o pipefail
          mkdir -p build/logs
          xctestrun=""
          count=0
          while IFS= read -r candidate; do
            xctestrun=$candidate
            count=$((count + 1))
          done < <(find build/DerivedData/Build/Products -maxdepth 2 -name '*.xctestrun' -type f)
          if [[ "$count" != 1 ]]; then
            echo "::error::Expected one .xctestrun file, found $count"
            exit 1
          fi

          if [[ "$LANE" == "core" ]]; then
            targets=(-only-testing:WingDexTests -only-testing:WingDexUITests)
            api_base_url=$API_BASE_URL
          else
            targets=(-only-testing:WingDexAccessibilityUITests)
            api_base_url=http://127.0.0.1:1
          fi

          started_at=$(date +%s)
          NSUnbufferedIO=YES TEST_RUNNER_API_BASE_URL="$api_base_url" xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "build/${LANE}.xcresult" \
            "${targets[@]}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "build/logs/${LANE}.log"
          status=${PIPESTATUS[0]}
          elapsed=$(( $(date +%s) - started_at ))
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          if [[ -d "build/${LANE}.xcresult" ]]; then
            summary=$(xcrun xcresulttool get test-results summary --path "build/${LANE}.xcresult" --compact)
            echo "total=$(jq -r .totalTestCount <<< "$summary")" >> "$GITHUB_OUTPUT"
            echo "passed=$(jq -r .passedTests <<< "$summary")" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Summarize lane
        if: always()
        working-directory: ios
        env:
          LANE: ${{ matrix.lane }}
        run: |
          {
            echo "### iOS $LANE lane"
            echo "- DerivedData/SwiftPM cache hit: \`${{ steps.build-cache.outputs.cache-hit }}\`"
            echo "- XcodeGen cache hit: \`${{ steps.xcodegen-cache.outputs.cache-hit }}\`"
            echo "- Bird ID asset cache hit: \`${{ steps.bird-id-cache.outputs.cache-hit }}\`"
            echo "- Build: ${{ steps.build.outputs.elapsed || 'unknown' }}s"
            echo "- Tests: ${{ steps.tests.outputs.elapsed || 'unknown' }}s"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ -d "build/${LANE}.xcresult" ]] || exit 0
          xcrun xcresulttool get test-results summary --path "build/${LANE}.xcresult" --compact \
            | jq -r '"- Result: \(.passedTests)/\(.totalTestCount) passed, \(.failedTests) failed, \(.skippedTests) skipped"' \
            >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results tests --path "build/${LANE}.xcresult" --compact \
            | jq -r '[.. | objects | select(.nodeType? == "Test Case")] | sort_by(.durationInSeconds // 0) | reverse | .[:5][] | "- \(.durationInSeconds // 0 | floor)s: `\(.nodeIdentifier // .name)`"' \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iOS-${{ matrix.lane }}-diagnostics
          path: |
            ios/build/${{ matrix.lane }}.xcresult
            ios/build/logs
          retention-days: 7

      - name: Clean up iOS Simulator
        if: always()
        run: |
          if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

  build-and-test:
    name: Build & Test (iOS Simulator)
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify iOS lanes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ACCESSIBILITY_REQUIRED: ${{ needs.plan.outputs.accessibility }}
          ACCESSIBILITY_REASON: ${{ needs.plan.outputs.accessibility_reason }}
        run: |
          set -euo pipefail
          {
            echo "### iOS CI result"
            if [[ "$ACCESSIBILITY_REQUIRED" == "true" ]]; then
              echo "- Lanes: core and accessibility"
            else
              echo "- Lanes: core; accessibility skipped ($ACCESSIBILITY_REASON)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLAN_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
