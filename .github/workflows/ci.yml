name: CI & Preview

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Verify & Deploy Preview
    runs-on: ubuntu-latest
    # Chromium + OS deps pre-installed; update tag when @playwright/test is bumped.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        # Skipped on a cache hit. The cache key is the OS plus the lockfile hash, so
        # a hit means node_modules matches package-lock.json. It does NOT track the
        # Node version, so bumping node-version can restore modules built against
        # the previous runtime; change the key if that ever matters.
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrate local D1
        run: printf 'y\n' | npx wrangler d1 migrations apply wingdex-db --local
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write .dev.vars for local e2e
        run: |
          umask 077
          printf 'BETTER_AUTH_SECRET=%s\nGEOAPIFY_KEY=%s\n' \
            "$BETTER_AUTH_SECRET" "$GEOAPIFY_KEY" > .dev.vars
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}

      - name: E2E tests
        run: npx playwright test --grep-invert @live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations to preview DB
        if: github.head_ref != 'dev' && github.head_ref != 'main'
        run: printf 'y\n' | npx wrangler d1 migrations apply wingdex-db-dev --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Skip deploy when the release workflow already handles this branch.
      # Use per-PR aliased preview URLs so concurrent PRs don't overwrite each
      # other. `wrangler versions upload --preview-alias pr-<N>` creates a
      # version with a stable alias URL of the form
      #   pr-<N>-wingdex-app-preview.<subdomain>.workers.dev
      # (requires preview_urls = true in wrangler.toml). Unlike `deploy`, this
      # does NOT change the live deployed version; each PR only gets its own
      # isolated preview URL.
      - name: Deploy preview to Cloudflare Workers
        if: github.head_ref != 'dev' && github.head_ref != 'main'
        id: deploy_preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Branch preview deployment
        if: github.head_ref != 'dev' && github.head_ref != 'main'
        uses: actions/github-script@v9
        env:
          # Prefer the alias URL wrangler actually printed (robust to subdomain
          # changes); fall back to the deterministic constructed URL. The URL is
          # surfaced on the PR via the GitHub deployment/Environments UI.
          COMMAND_OUTPUT: ${{ steps.deploy_preview.outputs['command-output'] || '' }}
          FALLBACK_ALIAS_URL: https://pr-${{ github.event.pull_request.number }}-wingdex-app-preview.lianguanlun.workers.dev
        with:
          script: |
            const out = process.env.COMMAND_OUTPUT || '';
            // wrangler prints e.g. "Version Preview URL: https://pr-259-...workers.dev"
            const m = out.match(/https:\/\/pr-[a-z0-9-]+-wingdex-app-preview\.[a-z0-9-]+\.workers\.dev/i);
            const previewUrl = (m && m[0]) || process.env.FALLBACK_ALIAS_URL;
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: '${{ github.event.pull_request.head.sha }}',
              environment: 'preview (#${{ github.event.pull_request.number }})',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: previewUrl || undefined,
            });
