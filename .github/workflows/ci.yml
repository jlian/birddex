name: CI & Preview

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Verify & Deploy Preview
    runs-on: ubuntu-latest
    # Chromium + OS deps pre-installed; update tag when @playwright/test is bumped.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Detect Cloudflare credentials
        id: cloudflare
        # GitHub withholds secrets from fork pull requests, so every step that
        # talks to Cloudflare has to be skipped there. The `secrets` context is
        # not available in a step `if:`, so resolve it once here and gate the
        # later steps on this output.
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        # Skipped on a cache hit. The cache key is the OS plus the lockfile hash, so
        # a hit means node_modules matches package-lock.json. It does NOT track the
        # Node version, so bumping node-version can restore modules built against
        # the previous runtime; change the key if that ever matters.
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: CLOUDFLARE_ENV=preview npm run build

      - name: Migrate local D1
        # `--env preview` to match the Playwright server, which now runs with
        # that environment so its R2 binding is the isolated preview bucket
        # rather than production. The preview environment binds a different D1
        # name (wingdex-db-dev), so migrating `wingdex-db` here would leave the
        # server pointed at an unmigrated local database. Still --local: this
        # is a disposable file, not the remote dev database.
        run: printf 'y\n' | npx wrangler d1 migrations apply wingdex-db-dev --local --env preview --persist-to "$HOME/.cache/wingdex/wrangler-state"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write .dev.vars for local e2e
        run: |
          umask 077
          printf 'BETTER_AUTH_SECRET=%s\nGEOAPIFY_KEY=%s\nGITHUB_CLIENT_ID=ci-test-client\nGITHUB_CLIENT_SECRET=ci-test-secret\n' \
            "$BETTER_AUTH_SECRET" "$GEOAPIFY_KEY" > .dev.vars
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}

      - name: E2E tests
        # D1 remains local and disposable. PLACES uses Wrangler mixed mode so
        # this existing suite also verifies the real PMTiles archive in R2.
        #
        # GitHub withholds secrets from FORK pull requests, so those runs cannot
        # reach the R2 archive. Two things are needed there, not one:
        #
        # 1. playwright.config.ts disables Vite plugin remote bindings when the
        #    Cloudflare credentials are incomplete. Without that the plugin
        #    cannot open the remote proxy session for the `remote = true`
        #    PLACES binding and the server never boots, so the step times out
        #    before a single test runs.
        # 2. `@remote-r2` is excluded here, because that test asserts against the
        #    real archive and a local bucket is empty.
        #
        # Gate on the same both-credentials output the detector step computed, so
        # a half-configured environment takes the local path instead of failing
        # at server start.
        #
        # Everything else stays self-contained and still runs. The remote D1
        # migration and the preview deployment below are skipped entirely on a
        # fork, so the run ends green after this step.
        run: |
          if [ "$CLOUDFLARE_AVAILABLE" = 'true' ]; then
            npx playwright test --grep-invert @live
          else
            echo "No Cloudflare credentials (likely a fork PR); running E2E fully local and skipping @remote-r2"
            npx playwright test --grep-invert "@live|@remote-r2"
          fi
        env:
          CLOUDFLARE_AVAILABLE: ${{ steps.cloudflare.outputs.available }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations to preview DB
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        run: printf 'y\n' | npx wrangler d1 migrations apply wingdex-db-dev --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Skip deploy when the release workflow already handles this branch.
      # Use per-PR aliased preview URLs so concurrent PRs don't overwrite each
      # other. `wrangler versions upload --preview-alias pr-<N>` creates a
      # version with a stable alias URL of the form
      #   pr-<N>-wingdex-app-preview.<subdomain>.workers.dev
      # (requires preview_urls = true in wrangler.toml). Unlike `deploy`, this
      # does NOT change the live deployed version; each PR only gets its own
      # isolated preview URL.
      - name: Deploy preview to Cloudflare Workers
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        id: deploy_preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Branch preview deployment
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        uses: actions/github-script@v9
        env:
          # Prefer the alias URL wrangler actually printed (robust to subdomain
          # changes); fall back to the deterministic constructed URL. The URL is
          # surfaced on the PR via the GitHub deployment/Environments UI.
          COMMAND_OUTPUT: ${{ steps.deploy_preview.outputs['command-output'] || '' }}
          FALLBACK_ALIAS_URL: https://pr-${{ github.event.pull_request.number }}-wingdex-app-preview.lianguanlun.workers.dev
        with:
          script: |
            const out = process.env.COMMAND_OUTPUT || '';
            // wrangler prints e.g. "Version Preview URL: https://pr-259-...workers.dev"
            const m = out.match(/https:\/\/pr-[a-z0-9-]+-wingdex-app-preview\.[a-z0-9-]+\.workers\.dev/i);
            const previewUrl = (m && m[0]) || process.env.FALLBACK_ALIAS_URL;
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: '${{ github.event.pull_request.head.sha }}',
              environment: 'preview (#${{ github.event.pull_request.number }})',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: previewUrl || undefined,
            });
