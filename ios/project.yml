name: WingDex
options:
  bundleIdPrefix: app.wingdex
  # Product minimum: the UI uses iOS 26 Tab and Liquid Glass APIs. CI should
  # install the matching runtime rather than lower this target.
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  preGenCommand: scripts/gen-git-info.sh && scripts/sync-birdid-assets.sh
  postGenCommand: scripts/fix-icon-ref.sh

configs:
  Localhost Debug: debug
  Localhost Release: release
  Dev Debug: debug
  Dev Release: release
  Production Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    DEVELOPMENT_TEAM: Z8LQS5S492
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"

targets:
  WingDex:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Generate Git Info
        script: "$SRCROOT/scripts/gen-git-info.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/gen-git-info.sh"
          - "$(SRCROOT)/../.git"
        outputFiles:
          - "$(SRCROOT)/WingDex/App/GitInfo.swift"
        basedOnDependencyAnalysis: false
      # The classifier and the prior are derived from public/, so a rebuilt
      # blob reaches the app without anyone remembering to copy it.
      - name: Sync Bird ID Assets
        script: "$SRCROOT/scripts/sync-birdid-assets.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/sync-birdid-assets.sh"
          - "$(SRCROOT)/../public/models/text_classifier_int8.bin"
          - "$(SRCROOT)/../public/priors/occurrence.d0abc168.bin.gz"
          - "$(SRCROOT)/../public/priors/rarity.410e7b98.bin.gz"
          # The script READS these two to learn the shipped asset filenames.
          # Under ENABLE_USER_SCRIPT_SANDBOXING an undeclared input is denied,
          # so leaving one out makes the script fail at the grep.
          - "$(SRCROOT)/../src/lib/bird-id-local-adapter.ts"
          - "$(SRCROOT)/../src/lib/rarity.ts"
          - "$(SRCROOT)/../src/lib/taxonomy.json"
          - "$(SRCROOT)/WingDex/Resources/taxonomy.json"
        outputFiles:
          - "$(SRCROOT)/WingDex/Resources/BirdID/text_classifier_int8.bin"
          - "$(SRCROOT)/WingDex/Resources/BirdID/occurrence.bin"
          - "$(SRCROOT)/WingDex/Resources/BirdID/rarity.bin"
          - "$(SRCROOT)/build/generated/sync-birdid-assets.stamp"
        basedOnDependencyAnalysis: true
    sources:
      - path: WingDex
        excludes:
          - "Preview Content"
          - "Resources/AppIcon.icon"
      - path: WingDex/Preview Content
        compilerFlags: ""
    resources:
      - path: WingDex/Resources
        excludes:
          - "AppIcon.icon"
      - path: WingDex/Assets.xcassets
      - path: WingDex/Preview Content/Preview Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingdex
        MARKETING_VERSION: "0.16.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WingDex/WingDex.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Localhost Debug:
          API_BASE_URL: https://localhost.wingdex.app
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        Localhost Release:
          API_BASE_URL: https://localhost.wingdex.app
        Dev Debug:
          API_BASE_URL: https://dev.wingdex.app
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        Dev Release:
          API_BASE_URL: https://dev.wingdex.app
        Production Debug:
          API_BASE_URL: https://wingdex.app
        Release:
          API_BASE_URL: https://wingdex.app
    info:
      path: WingDex/Info.plist
      properties:
        CFBundleDisplayName: WingDex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        APIBaseURL: "$(API_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "WingDex uses the camera so you can take bird photos for identification."
        NSLocationWhenInUseUsageDescription: "WingDex uses your location to tag where bird photos were taken and suggest outing names. Exact coordinates are saved with outings and photo metadata. Reverse lookup runs on WingDex servers; typed place searches are sent to Geoapify."
        NSPhotoLibraryUsageDescription: "WingDex uses your photo library so you can choose bird photos to identify."
        NSPhotoLibraryAddUsageDescription: "WingDex may save captured bird photos to your library when you choose to keep them."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - wingdex
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.wingdex.quick-action.take-photo
            UIApplicationShortcutItemTitle: Take Photo
            UIApplicationShortcutItemIconSymbolName: camera.fill
          - UIApplicationShortcutItemType: app.wingdex.quick-action.upload-photos
            UIApplicationShortcutItemTitle: Upload Photos
            UIApplicationShortcutItemIconSymbolName: photo.on.rectangle
          - UIApplicationShortcutItemType: app.wingdex.quick-action.view-wingdex
            UIApplicationShortcutItemTitle: View WingDex
            UIApplicationShortcutItemIconSymbolName: bird
    dependencies:
      - target: WingDexShareExtension
        embed: true
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: KeychainAccess

  WingDexShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WingDexShareExtension
        excludes:
          - "*.entitlements"
      - path: WingDex/Services/IncomingShareStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingdex.share
        MARKETING_VERSION: "0.16.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WingDexShareExtension/WingDexShareExtension.entitlements
        SKIP_INSTALL: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: WingDexShareExtension/Info.plist
      properties:
        CFBundleDisplayName: WingDex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationUsesStrictMatching: true
              NSExtensionActivationSupportsAttachmentsWithMinCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10000
              NSExtensionActivationSupportsImageWithMaxCount: 10000

  WingDexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WingDexTests
        # Parity fixtures are read from disk via #filePath, never from the test
        # bundle. Letting xcodegen sweep them in makes the 33 MiB prior a test
        # resource, which rewrites the Resources build phases and drops
        # Assets.xcassets from the app target, breaking the AppIcon lookup.
        excludes:
          - "Fixtures"
    dependencies:
      - target: WingDex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingdex.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"

  WingDexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WingDexUITests
        excludes:
          - "AccessibilityAuditUITests.swift"
          - "AccessibilityAuditJourneys.swift"
    dependencies:
      - target: WingDex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingdex.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: WingDex

  WingDexAccessibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WingDexUITests/BirdIdFlowUITestCase.swift
      - path: WingDexUITests/AccessibilityAuditJourneys.swift
    dependencies:
      - target: WingDex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingdex.accessibility-uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: WingDex

schemes:
  Localhost:
    build:
      targets:
        WingDex: all
    run:
      config: Localhost Debug
      commandLineArguments:
        # Localhost starts sessionless; individual tests opt into identities.
        "--auto-sign-in": false
    test:
      config: Localhost Debug
      targets:
        - name: WingDexTests
          parallelizable: false
        - name: WingDexUITests
          parallelizable: false
        - name: WingDexAccessibilityUITests
          parallelizable: false
    profile:
      config: Localhost Release
    analyze:
      config: Localhost Debug
    archive:
      config: Localhost Release

  Dev:
    build:
      targets:
        WingDex: all
    run:
      config: Dev Debug
      commandLineArguments:
        "--auto-sign-in": false
    test:
      config: Dev Debug
      targets:
        - name: WingDexTests
          parallelizable: false
        - name: WingDexUITests
          parallelizable: false
        - name: WingDexAccessibilityUITests
          parallelizable: false
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release

  Dev CI:
    build:
      targets:
        WingDex: all
    run:
      config: Dev Debug
      commandLineArguments:
        "--auto-sign-in": false
    test:
      config: Dev Debug
      debugEnabled: false
      targets:
        - name: WingDexTests
          parallelizable: false
        - name: WingDexUITests
          parallelizable: false
        - name: WingDexAccessibilityUITests
          parallelizable: false
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release

  Production:
    build:
      targets:
        WingDex: all
    run:
      config: Release
    test:
      config: Production Debug
      targets:
        - name: WingDexTests
          parallelizable: false
        - name: WingDexUITests
          parallelizable: false
        - name: WingDexAccessibilityUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

packages:
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: "1.6.0"
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: "1.7.0"
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: "1.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
